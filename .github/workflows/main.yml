name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Mobile Notepad APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        run: |
          rm -rf app_source
          mkdir app_source
          unzip -q mobile_notepad_github_apk.zip -d app_source
          ls -la app_source/mobile_notepad_v1

      - name: Generate Android project
        working-directory: app_source/mobile_notepad_v1
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          cp analysis_options.yaml /tmp/analysis_options.yaml

          flutter create \
            --platforms=android \
            --project-name mobile_notepad \
            --org com.mobilenotepad \
            .

          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/analysis_options.yaml analysis_options.yaml

      - name: Set minimum Android SDK
        working-directory: app_source/mobile_notepad_v1
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Install dependencies
        working-directory: app_source/mobile_notepad_v1
        run: flutter pub get

      - name: Build APK
        working-directory: app_source/mobile_notepad_v1
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Notepad-APK
          path: app_source/mobile_notepad_v1/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
