name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Mobile Notepad APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when missing
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            cp lib/main.dart /tmp/mobile_notepad_main.dart
            cp pubspec.yaml /tmp/mobile_notepad_pubspec.yaml
            cp analysis_options.yaml /tmp/mobile_notepad_analysis_options.yaml

            flutter create \
              --platforms=android \
              --project-name mobile_notepad \
              --org com.mobilenotepad \
              .

            cp /tmp/mobile_notepad_main.dart lib/main.dart
            cp /tmp/mobile_notepad_pubspec.yaml pubspec.yaml
            cp /tmp/mobile_notepad_analysis_options.yaml analysis_options.yaml
          fi

      - name: Set Android minimum SDK to 24
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Mobile-Notepad.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Notepad-APK
          path: release/Mobile-Notepad.apk
          retention-days: 14
